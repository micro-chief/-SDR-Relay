name: Publish

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  publish:
    name: ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            archive: zip
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64
            archive: tar.gz
          - rid: linux-arm
            archive: tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained executable
        run: >-
          dotnet publish SDR-Relay.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output publish/${{ matrix.rid }}

      - name: Prepare package directory
        run: |
          mkdir -p package/SDR-Relay
          cp -a "publish/${{ matrix.rid }}/." package/SDR-Relay/

      - name: Pack Windows executable
        if: matrix.archive == 'zip'
        run: |
          cd package
          zip -r "../SDR-Relay-${{ matrix.rid }}.zip" SDR-Relay

      - name: Pack Linux executable
        if: matrix.archive == 'tar.gz'
        run: >-
          tar -czf SDR-Relay-${{ matrix.rid }}.tar.gz
          -C package SDR-Relay

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SDR-Relay-${{ matrix.rid }}
          path: SDR-Relay-${{ matrix.rid }}.${{ matrix.archive }}
          if-no-files-found: error
